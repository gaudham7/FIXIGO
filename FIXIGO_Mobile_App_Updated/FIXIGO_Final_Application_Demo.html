<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXIGO — Application Preview</title>
<style>
:root{--teal:#0b6b5b;--deep:#0f3d34;--ivory:#f9f6ef;--mint:#6dd3b6;--gold:#d4a017;--ink:#20332e;--muted:#71817b;--line:#e6e9e3;--white:#fff;--red:#c94b42;--green:#21865e}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1440px;margin:auto;padding:20px}.banner{height:170px;border-radius:22px;background:linear-gradient(115deg,#073f38,#0b5549 60%,#07352f);color:#fff;position:relative;overflow:hidden;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 28px #0b403019}.brand{display:flex;align-items:center;gap:12px;z-index:2}.logo{width:58px;height:48px}.brandcopy{border-left:1px solid #8bbdb0;padding-left:13px}.brandname{font-size:29px;font-weight:800;letter-spacing:-1px}.brandname span{display:inline-block;animation:twinkle 3.1s infinite}.brandname span:nth-child(2){animation-delay:.2s}.brandname span:nth-child(3){animation-delay:.4s}.brandname span:nth-child(4){animation-delay:.6s}.brandname span:nth-child(5){animation-delay:.8s}.brandname span:nth-child(6){animation-delay:1s}@keyframes twinkle{0%,72%,100%{text-shadow:none}78%{text-shadow:0 0 8px white,0 0 18px #9effd9;color:#c5ffe8}}.motto{font-size:13px;color:#c4e1d8}.banner-art{position:absolute;right:18px;top:0;width:48%;height:100%;display:flex;align-items:end;justify-content:center;pointer-events:none}.banner-art:before{content:"";position:absolute;inset:22px 5% 10px;border:1px solid #46d5a04f;border-radius:50%;transform:rotate(-8deg);box-shadow:0 0 25px #26d9a044}.banner-art:after{content:"";position:absolute;bottom:23px;left:5%;right:5%;height:2px;background:linear-gradient(90deg,transparent,#3ee4aa,transparent);filter:drop-shadow(0 0 6px #4affbd)}.crew{position:relative;z-index:1;display:flex;align-items:end;gap:clamp(0px,1.5vw,20px);height:145px;padding-bottom:18px}.person{width:62px;height:125px;position:relative;transform:translateY(24px);opacity:.35;animation:arrive 7s ease-in-out infinite}.person:nth-child(2){animation-delay:.12s}.person:nth-child(3){animation-delay:.24s}.person:nth-child(4){animation-delay:.36s}.person:nth-child(5){animation-delay:.48s}@keyframes arrive{0%,12%{transform:translate(var(--dx),25px) scale(.88);opacity:.3}34%,78%{transform:translateY(0) scale(1);opacity:1}90%,100%{transform:translateY(0) scale(1);opacity:1}}.person .head{width:27px;height:27px;border-radius:50%;background:#bd8765;margin:0 auto;position:relative;border:3px solid #243c36}.person .hat{position:absolute;width:35px;height:10px;border-radius:14px 14px 4px 4px;top:-3px;left:-4px;background:var(--hat)}.body{width:49px;height:57px;border-radius:13px 13px 5px 5px;background:var(--shirt);margin:0 auto}.legs{display:flex;justify-content:center;gap:7px}.legs i{width:12px;height:34px;background:#d5ded6;border-radius:5px}.arm{position:absolute;width:9px;height:40px;border-radius:9px;background:#bd8765;top:38px;left:5px;transform:rotate(24deg)}.thumb{position:absolute;right:-4px;top:31px;font-size:24px;opacity:0;animation:thumb 7s ease-in-out infinite}@keyframes thumb{0%,39%{opacity:0;transform:translateY(8px) rotate(-30deg)}52%,84%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0}}.s1{--hat:#e8b72f;--shirt:#276c72;--dx:-38px}.s2{--hat:#276b9c;--shirt:#b86e45;--dx:-20px}.s3{--hat:#292e31;--shirt:#0e8069;--dx:0px}.s4{--hat:#e6e7df;--shirt:#e1e5d9;--dx:20px}.s5{--hat:#303c43;--shirt:#526b88;--dx:38px}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:20px}.sidebar,.panel,.card{background:var(--white);border:1px solid var(--line);border-radius:18px}.sidebar{padding:16px;height:max-content;position:sticky;top:15px}.portal-title{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 8px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#52645d;font-size:14px}.nav button.active,.nav button:hover{background:#eaf5f0;color:var(--teal);font-weight:700}.portal-switch{display:flex;gap:7px;margin:14px 0 0;flex-wrap:wrap}.portal-switch button{background:#f2f5f1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:#52645d}.portal-switch button.active{background:var(--deep);color:white}.main{min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 16px}.eyebrow{font-size:12px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.h1{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:3px 0}.sub{font-size:13px;color:var(--muted)}.btn{background:var(--teal);color:#fff;padding:10px 15px;border-radius:10px;font-weight:700;font-size:13px}.btn.secondary{background:#eaf5f0;color:var(--teal)}.btn.gold{background:#fff5d8;color:#896508}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:15px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:16px}.metric{font-size:25px;font-weight:800;margin:6px 0}.metric-label{font-size:12px;color:var(--muted)}.section{font-size:16px;font-weight:800;margin:20px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.service{padding:13px 10px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.service:hover{border-color:var(--mint);background:#f5fbf8}.ico{font-size:23px}.service b{display:block;font-size:13px;margin-top:7px}.service small{font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f6ee;color:#23764f;font-size:11px;font-weight:700}.pill.gold{background:#fff4d6;color:#88630c}.pill.red{background:#ffefed;color:#a83d34}.job{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.job h3{font-size:14px;margin:0 0 5px}.job p{font-size:12px;color:var(--muted);margin:4px 0}.job-actions{display:flex;gap:8px;margin-top:10px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:700;color:#53645e}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe6e0;border-radius:10px;background:#fff;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:700}.notice{padding:12px;border-radius:12px;background:#eff8f4;color:#276b58;font-size:12px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#153f35;color:white;padding:12px 16px;border-radius:12px;box-shadow:0 8px 25px #0002;z-index:20;font-size:13px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filters input,.filters select{border:1px solid var(--line);padding:9px;border-radius:9px;background:white}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.banner{height:150px}.banner-art{width:47%;opacity:.9}.grid.four{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:10px}.banner{height:142px;padding:14px}.brandname{font-size:23px}.logo{width:44px}.motto{font-size:10px}.banner-art{width:46%;right:0}.person{width:37px;transform:scale(.8)}.crew{gap:0;height:125px}.layout{gap:12px}.grid,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.service-grid{grid-template-columns:repeat(2,1fr)}.h1{font-size:21px}}
</style></head><body><div class="shell">
<header class="banner"><div><div class="brand"><svg class="logo" viewBox="0 0 90 60"><circle cx="25" cy="8" r="7" fill="#f4b51b"/><circle cx="65" cy="8" r="7" fill="#e6fff6"/><path d="M12 34C23 14 37 20 47 30L66 47C76 55 88 43 79 31C70 18 59 21 47 31L25 48C12 58 1 44 12 34Z" fill="none" stroke="#39c9a7" stroke-width="9" stroke-linecap="round"/><path d="M48 30L66 47C76 55 88 43 79 31" fill="none" stroke="#e8a91b" stroke-width="8" stroke-linecap="round"/></svg><div class="brandcopy"><div class="brandname"><span>F</span><span>I</span><span>X</span><span>I</span><span>G</span><span>O</span></div><div class="motto">Right Place. Right Skill. Right Time.</div></div></div></div><div class="banner-art"><div class="crew"><div class="person s1"><div class="head"><i class="hat"></i></div><div class="arm"></div><div class="body"></div><div class="legs"><i></i><i></i></div><span class="thumb">👍</span></div><div class="person s2"><div class="head"><i class="hat"></i></div><div class="arm"></div><div class="body"></div><div class="legs"><i></i><i></i></div><span class="thumb">👍</span></div><div class="person s3"><div class="head"><i class="hat"></i></div><div class="arm"></div><div class="body"></div><div class="legs"><i></i><i></i></div><span class="thumb">👍</span></div><div class="person s4"><div class="head"><i class="hat"></i></div><div class="arm"></div><div class="body"></div><div class="legs"><i></i><i></i></div><span class="thumb">👍</span></div><div class="person s5"><div class="head"><i class="hat"></i></div><div class="arm"></div><div class="body"></div><div class="legs"><i></i><i></i></div><span class="thumb">👍</span></div></div></div></header>
<div class="layout"><aside class="sidebar"><div class="portal-title">Choose portal</div><div class="portal-switch"><button class="active" data-portal="customer">Customer</button><button data-portal="provider">Provider</button><button data-portal="admin">Admin</button></div><div class="portal-title" style="margin-top:22px">Workspace</div><nav class="nav" id="nav"></nav><div class="notice" style="margin-top:18px">Preview mode · Sample data only</div></aside><main class="main"><div id="view"></div></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let portal='customer',page='Overview',online=true,requests=[{id:'FX-1042',name:'Kitchen sink leakage',type:'Plumbing',status:'Finding a professional',when:'Today, 4:30 PM'},{id:'FX-1038',name:'Ceiling fan installation',type:'Electrical',status:'Confirmed',when:'Tomorrow, 10:00 AM'}],jobs=[{id:'JB-221',name:'AC not cooling',type:'Appliance repair',place:'2.4 km away',pay:'₹650–₹900',state:'New'},{id:'JB-220',name:'Bathroom tap replacement',type:'Plumbing',place:'4.1 km away',pay:'₹450–₹600',state:'New'}],section='Overview';
const navs={customer:['Overview','Find a service','My bookings','Messages','Payments','Service history','Help & support','My profile'],provider:['Overview','Job opportunities','My schedule','Active jobs','Earnings','My skills & profile','Verification','Support'],admin:['Overview','Service requests','Bookings & matching','Providers','Customers','Verification queue','Categories & skills','Pricing oversight','Disputes & support','Analytics']};
function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2300)}
function switchPortal(p){portal=p;section='Overview';$$('[data-portal]').forEach(b=>b.classList.toggle('active',b.dataset.portal===p));render()}
$$('[data-portal]').forEach(b=>b.onclick=()=>switchPortal(b.dataset.portal));
function go(p){section=p;render()}
function header(title,sub,action=''){return `<div class="topline"><div><div class="eyebrow">${portal} portal</div><div class="h1">${title}</div><div class="sub">${sub}</div></div>${action}</div>`}
function metric(a,b,c){return `<div class="card"><div class="metric-label">${a}</div><div class="metric">${b}</div><div class="metric-label">${c}</div></div>`}
function services(){let a=[['⚡','Electrical','Repairs & installation'],['🔧','Plumbing','Leaks & fittings'],['❄️','Appliance repair','AC, fridge & more'],['🪚','Carpentry','Furniture & fixtures'],['🧹','Cleaning','Home & workplace'],['🧰','Maintenance','General repairs'],['📦','Moving help','Loading & shifting'],['🌿','Gardening','Outdoor maintenance']];return `<div class="service-grid">${a.map(x=>`<button class="service" onclick="prefill('${x[1]}')"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>`}
function customer(){if(section==='Find a service')return header('Tell us what you need','Describe the issue and FIXIGO will help structure your request.')+`<div class="card"><form id="requestForm"><div class="field"><label>Service category</label><select id="cat"><option>Electrical</option><option>Plumbing</option><option>Appliance repair</option><option>Carpentry</option><option>Cleaning</option><option>Maintenance</option><option>Moving help</option><option>Gardening</option></select></div><div class="field"><label>Describe the work</label><textarea id="desc" required placeholder="Example: The kitchen tap is leaking from the base..."></textarea></div><div class="grid"><div class="field"><label>Preferred date</label><input type="date" id="date"></div><div class="field"><label>Preferred time</label><select id="time"><option>Flexible</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div><div class="field"><label>Location / area</label><input id="area" placeholder="Your locality"></div></div><div class="notice">AI assistance preview: request details will be structured for skill matching. Live AI analysis is not connected in this demo.</div><div style="margin-top:14px"><button class="btn">Submit service request</button></div></form></div><div class="section">Popular services</div>${services()}`;
if(section==='My bookings'||section==='Service history')return header(section,'Track upcoming and previous service requests.')+`<div class="stack">${requests.map(r=>`<div class="job"><div class="row"><h3>${r.name}</h3><span class="pill">${r.status}</span></div><p>${r.id} · ${r.type} · ${r.when}</p><div class="job-actions"><button class="btn secondary" onclick="toast('Booking details opened in preview')">View details</button><button class="btn secondary" onclick="toast('Support request started')">Get help</button></div></div>`).join('')}</div>`;
if(section==='Messages')return header('Messages','Conversations with assigned professionals.')+`<div class="card empty">No active conversations yet. Your conversations will appear here after a booking is confirmed.</div>`;
if(section==='Payments')return header('Payments','Quotes, invoices and payment records.')+`<div class="grid">${metric('Payment methods','2','Demo payment profiles')}${metric('Total spent','₹2,450','Illustrative sample')}${metric('Pending','₹0','No pending payments')}</div><div class="card"><div class="section">Recent transactions</div><p class="sub">No live payment gateway is connected in this preview.</p></div>`;
if(section==='Help & support')return header('Help & support','Get assistance with a request or booking.')+`<div class="card"><div class="field"><label>How can we help?</label><textarea placeholder="Describe your issue"></textarea></div><button class="btn" onclick="toast('Support ticket created in demo')">Create support request</button></div>`;
if(section==='My profile')return header('My profile','Manage your personal details and saved addresses.')+`<div class="card"><div class="field"><label>Full name</label><input value="Demo Customer"></div><div class="field"><label>Phone</label><input value="+91 XXXXX XXXXX"></div><div class="field"><label>Saved address</label><input placeholder="Add your address"></div><button class="btn" onclick="toast('Profile saved in this preview')">Save changes</button></div>`;
return header('Welcome back','What do you need help with today?',`<button class="btn" onclick="go('Find a service')">＋ New request</button>`)+`<div class="grid">${metric('Active bookings',requests.length,'Your current service requests')}${metric('Completed services','12','Illustrative history')}${metric('Saved professionals','4','Your preferred providers')}</div><div class="section">Find a professional</div>${services()}<div class="section">Upcoming bookings</div><div class="stack">${requests.slice(0,2).map(r=>`<div class="job"><div class="row"><h3>${r.name}</h3><span class="pill">${r.status}</span></div><p>${r.type} · ${r.when}</p></div>`).join('')}</div>`}
function provider(){if(section==='Job opportunities'||section==='Overview'){let overview=section==='Overview';return header(overview?'Your work overview':'Job opportunities',overview?'Manage availability and see suitable work nearby.':'Review incoming work and choose opportunities that fit your skills.',`<button class="btn ${online?'':'secondary'}" onclick="online=!online;render()">${online?'● Online':'○ Offline'}</button>`)+(overview?`<div class="grid">${metric('Availability',online?'Online':'Offline','You control when you receive jobs')}${metric('This week','₹6,850','Illustrative earnings')}${metric('Jobs completed','18','Illustrative total')}</div><div class="notice">${online?'You are visible for eligible nearby opportunities.':'You are offline and will not receive new opportunities.'}</div><div class="section">Recommended opportunities</div>`:'')+`<div class="stack">${jobs.map(j=>`<div class="job"><div class="row"><h3>${j.name}</h3><span class="pill ${j.state==='Accepted'?'':'gold'}">${j.state}</span></div><p>${j.type} · ${j.place} · Estimated ${j.pay}</p><div class="job-actions"><button class="btn" onclick="accept('${j.id}')">${j.state==='Accepted'?'Accepted':'Accept job'}</button><button class="btn secondary" onclick="toast('Job details opened')">View details</button><button class="btn secondary" onclick="toast('Opportunity declined')">Decline</button></div></div>`).join('')}</div>`}
if(section==='My schedule')return header('My schedule','Set your working availability.')+`<div class="card"><div class="row"><b>Availability status</b><button class="btn ${online?'':'secondary'}" onclick="online=!online;render()">${online?'Online':'Offline'}</button></div><div class="field"><label>Service area</label><input value="Within 10 km"></div><div class="field"><label>Working days</label><input value="Monday – Saturday"></div><div class="field"><label>Working hours</label><input value="9:00 AM – 6:00 PM"></div><button class="btn" onclick="toast('Schedule saved in preview')">Save schedule</button></div>`;
if(section==='Active jobs')return header('Active jobs','Manage accepted work and completion updates.')+`<div class="stack">${jobs.filter(j=>j.state==='Accepted').map(j=>`<div class="job"><h3>${j.name}</h3><p>${j.id} · ${j.type}</p><button class="btn" onclick="toast('Job marked complete in preview')">Mark completed</button></div>`).join('')||'<div class="card empty">No active jobs yet. Accept an opportunity to begin.</div>'}</div>`;
if(section==='Earnings')return header('Earnings','Review income and payout records.')+`<div class="grid">${metric('Available balance','₹4,250','Illustrative balance')}${metric('This month','₹18,600','Before applicable deductions')}${metric('Completed jobs','18','Sample record')}</div><div class="card notice">Bank and payout processing are not connected in this prototype.</div>`;
if(section==='My skills & profile'||section==='Verification')return header(section,'Manage your professional identity and qualifications.')+`<div class="card"><div class="field"><label>Professional name</label><input value="Demo Professional"></div><div class="field"><label>Primary skill</label><select><option>Electrical</option><option>Plumbing</option><option>Appliance repair</option><option>Carpentry</option></select></div><div class="field"><label>Experience</label><input value="3 years"></div><div class="field"><label>Service area</label><input value="10 km radius"></div><div class="notice">Identity and skill-document verification are illustrative; document verification is not connected.</div><button class="btn" onclick="toast('Profile updated in preview')">Save profile</button></div>`;
return header(section,'Professional support and account options.')+`<div class="card"><p class="sub">Manage account preferences, support requests and professional information.</p><button class="btn secondary" onclick="toast('Support centre opened')">Contact support</button></div>`}
function admin(){if(section==='Service requests'||section==='Bookings & matching'||section==='Overview'){let rows=[...requests,{id:'FX-1037',name:'Washing machine inspection',type:'Appliance repair',status:'Completed',when:'Yesterday'}];return header(section==='Overview'?'Operations overview':section,'Monitor service activity, workforce and operational queues.')+(section==='Overview'?`<div class="grid four">${metric('Requests today','28','Illustrative sample')}${metric('Active bookings','16','Illustrative sample')}${metric('Verified providers','142','Illustrative sample')}${metric('Open disputes','3','Illustrative sample')}</div>`:'')+`<div class="card"><div class="row"><b>Service request queue</b><span class="pill">Demo data</span></div><div class="filters"><input id="search" placeholder="Search requests..." oninput="filterRows()"><select id="statusFilter" onchange="filterRows()"><option value="">All statuses</option><option>Confirmed</option><option>Completed</option><option>Finding a professional</option></select></div><div style="overflow:auto"><table class="table"><thead><tr><th>Request</th><th>Category</th><th>Status</th><th>Schedule</th><th>Action</th></tr></thead><tbody id="rows">${rows.map(r=>`<tr data-text="${r.id} ${r.name} ${r.type} ${r.status}"><td><b>${r.id}</b><br>${r.name}</td><td>${r.type}</td><td>${r.status}</td><td>${r.when}</td><td><button class="btn secondary" onclick="toast('Request opened')">Review</button></td></tr>`).join('')}</tbody></table></div></div>`}
if(section==='Providers'||section==='Customers'||section==='Verification queue')return header(section,'Review accounts, credentials and platform participation.')+`<div class="grid">${metric('Total records','186','Illustrative sample')}${metric('Pending review','12','Requires admin action')}${metric('Verified','142','Sample verified accounts')}</div><div class="card"><div class="row"><b>${section} queue</b><span class="pill gold">12 pending</span></div><div class="filters"><input placeholder="Search by name or ID"><select><option>All statuses</option><option>Pending</option><option>Verified</option><option>Rejected</option></select></div><table class="table"><tr><th>Profile</th><th>Category</th><th>Status</th><th>Action</th></tr><tr><td>Demo professional · PR-102</td><td>Electrical</td><td><span class="pill gold">Pending</span></td><td><button class="btn" onclick="toast('Verification approved in preview')">Approve</button></td></tr><tr><td>Demo professional · PR-103</td><td>Plumbing</td><td><span class="pill">Verified</span></td><td><button class="btn secondary" onclick="toast('Profile opened')">Review</button></td></tr></table></div>`;
if(section==='Categories & skills')return header(section,'Maintain the service taxonomy and skill catalogue.')+`<div class="card">${services()}<div class="field"><label>Add category or skill</label><input id="newcat" placeholder="Enter category name"></div><button class="btn" onclick="toast($('#newcat').value? 'Category added in preview':'Enter a category first')">＋ Add category</button></div>`;
if(section==='Pricing oversight')return header(section,'Review estimates and transparent pricing rules.')+`<div class="card"><div class="field"><label>Service category</label><select><option>Electrical</option><option>Plumbing</option><option>Appliance repair</option></select></div><div class="grid"><div class="field"><label>Base labor (₹)</label><input type="number" value="350"></div><div class="field"><label>Travel (₹)</label><input type="number" value="80"></div><div class="field"><label>Complexity factor</label><select><option>Standard</option><option>Complex</option></select></div></div><div class="notice">Final prices must be transparent and approved; AI may explain estimates but does not independently set charges.</div><button class="btn" onclick="toast('Pricing rule saved in preview')">Save rule</button></div>`;
if(section==='Disputes & support')return header(section,'Resolve customer and provider issues.')+`<div class="stack"><div class="job"><h3>Case DS-008 · Service quality concern</h3><p>Customer follow-up required · Open</p><button class="btn" onclick="toast('Case assigned in preview')">Assign case</button></div><div class="job"><h3>Case DS-007 · Booking cancellation</h3><p>Provider response pending</p><button class="btn secondary" onclick="toast('Case details opened')">Review</button></div></div>`;
